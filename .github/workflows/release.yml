name: Release

# One tag coordinates the release of both public packages. The GitHub release
# event is deliberately absent: publishing a release for the tag would start a
# second, identical run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v2.0.0'
        required: true
        type: string
      dist-tag:
        description: 'npm dist-tag (default: latest for a stable version, beta for a prerelease)'
        required: false
        type: string

permissions:
  contents: write
  # Trusted publishing: npm exchanges this short-lived OIDC token for a
  # package-scoped publish credential, so no long-lived NPM_TOKEN is stored
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish public packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm 11.5.1+ is required for trusted publishing; Node 24 ships it
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the test suite
        run: pnpm test

      - name: Check the release tag against both manifests
        run: node scripts/release.mjs check-tag --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Build the bridge and the CLI
        run: |
          pnpm --dir packages/bridge run build
          pnpm --dir packages/agent-kit run build

      # Exactly two tarballs, packed from their package directories. Packing
      # runs the package prepack hook, so the staged resource template is
      # produced here; nothing is rebuilt afterwards.
      - name: Pack exactly the two public tarballs
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          pnpm --dir packages/bridge pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --dir packages/agent-kit pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Verify the tarballs that will be published
        run: node scripts/release.mjs verify --artifacts artifacts

      # Publishes the uploaded tarballs in dependency order: bridge, bounded
      # wait until that exact version resolves, then the CLI. Versions already
      # present with the same number are skipped; any other registry answer
      # fails the run. The private resource is never published.
      # Publishing stays off until the repository variable NPM_PUBLISH is true:
      # the token for the scope has to exist before the first release, and a
      # tag should still produce verified tarballs while that is pending.
      - name: Explain why publishing is skipped
        if: vars.NPM_PUBLISH != 'true'
        run: |
          echo "::warning::npm publishing is disabled. Configure a trusted publisher for this repository (npm package settings → Trusted publishing: cybermp-community/agent-kit, workflow release.yml), then set the repository variable NPM_PUBLISH=true."

      - name: Publish the bridge, wait for it, then the CLI
        if: vars.NPM_PUBLISH == 'true'
        run: node scripts/release.mjs publish --artifacts artifacts --dist-tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ inputs.dist-tag }}

      - name: Attach the verified tarballs to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
