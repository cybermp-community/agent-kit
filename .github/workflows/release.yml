name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag to publish under (e.g. latest, beta, next)'
        required: false
        default: 'latest'
        type: string

jobs:
  release:
    name: Build & Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync official documentation
        run: pnpm run sync:docs

      - name: Rebuild AST type and docs index
        run: pnpm run build:index

      - name: Run test suite
        run: pnpm test

      - name: Build TypeScript package
        run: pnpm run build

      - name: Package release tarball
        run: pnpm pack

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: cybermp-agent-kit-*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm registry
        if: env.NODE_AUTH_TOKEN != ''
        run: pnpm publish --no-git-checks --tag ${{ inputs.tag || 'latest' }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
